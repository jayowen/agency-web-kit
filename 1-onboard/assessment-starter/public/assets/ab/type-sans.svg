  <text x="200" y="142" text-anchor="middle" font-family="Helvetica, Arial, 'Helvetica Neue', sans-serif" font-size="32" letter-spacing="4" fill="#1F2A37">NORTHFIELD</text>
  <line x1="120" y1="168" x2="280" y2="168" stroke="#1F2A37" stroke-width="1"/>
  <text x="200" y="192" text-anchor="middle" font-family="Helvetica, Arial, 'Helvetica Neue', sans-serif" font-size="11" letter-spacing="3" fill="#1F2A37">STYLE SPECIMEN</text>
</svg>
