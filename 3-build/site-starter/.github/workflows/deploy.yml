# Builds, checks and deploys on every push to main. A failed check stops the deploy.
# Repo secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build.mjs
      - run: node scripts/check.mjs
      - name: Read project name
        id: cfg
        run: echo "project=$(node -p "require('./site.config.json').pagesProject")" >> "$GITHUB_OUTPUT"
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name ${{ steps.cfg.outputs.project }} --branch main
